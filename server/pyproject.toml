[project]
name = "server"
version = "0.1.0"
description = "FastAPI server: SerpAPI products/reviews + calls the reviewnlp package"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=8.0.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
    "reviewnlp",
]

[tool.uv.sources]
reviewnlp = { path = "../nlp", editable = true }

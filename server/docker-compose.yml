# Needs: Linux/WSL2 + NVIDIA driver + NVIDIA Container Toolkit. Tuned for a 24 GB GPU (L4).
#   docker compose up --build
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --max-model-len 8192
      --gpu-memory-utilization 0.55
      --dtype half
    ports: ["8001:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  api:
    build: .
    depends_on: [vllm]
    env_file: [.env]
    environment:
      LLM_BASE_URL: http://vllm:8000/v1
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    volumes:
      - hf-cache:/hf-cache
      - ./models:/app/models   # put the notebook's spam-xlmr/ folder here
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  hf-cache:

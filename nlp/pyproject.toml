[project]
name = "reviewnlp"
version = "0.1.0"
description = "Multilingual review NLP: spam filter, embeddings, sentiment, themes, local LLM summary"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "datasketch>=1.6",
    "lingua-language-detector>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "joblib>=1.4",
    "torch>=2.4",
    "transformers>=4.45",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "sentencepiece>=0.2",
    "tiktoken>=0.7",
    "protobuf>=4.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewnlp"]
